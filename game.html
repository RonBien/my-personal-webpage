<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HELIX PROTOCOL — A Science Thriller</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111826; --ink:#d7e2f0; --dim:#7c8aa0;
    --accent:#33e0c8; --accent2:#f5b942; --danger:#ff5a6a; --ok:#5ad67d;
    --line:#22304a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Georgia","Times New Roman",serif;background:
     radial-gradient(1200px 600px at 70% -10%, #16233b 0%, var(--bg) 55%);
     color:var(--ink);min-height:100vh;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:1.9rem;letter-spacing:2px;margin:.2em 0;color:#fff}
  .sub{color:var(--accent);letter-spacing:3px;text-transform:uppercase;font-size:.72rem;font-family:monospace}
  .hud{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;font-family:monospace;font-size:.78rem}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--dim)}
  .chip b{color:var(--ink)}
  .chip.time b{color:var(--accent2)}
  .chip.time.warn{border-color:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{50%{background:rgba(255,90,106,.18)}}
  .bar{height:8px;background:#26314a;border-radius:6px;overflow:hidden;flex:1;min-width:120px;align-self:center}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--danger),var(--accent2),var(--ok))}
  .panel{background:linear-gradient(180deg,#131c2c,#0e1522);border:1px solid var(--line);
     border-radius:14px;padding:22px;margin-top:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .scene-title{font-family:monospace;color:var(--accent2);letter-spacing:1px;font-size:.8rem;text-transform:uppercase;margin-bottom:6px}
  .story{white-space:pre-wrap}
  .prompt{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);color:#fff;font-weight:bold}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  button.opt{font-family:inherit;text-align:left;background:#0e1728;color:var(--ink);
     border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s;font-size:1rem}
  button.opt:hover{border-color:var(--accent);background:#12203a;transform:translateX(3px)}
  .row{display:flex;gap:8px;margin-top:14px}
  input[type=text]{flex:1;background:#0e1728;border:1px solid var(--line);border-radius:10px;
     color:#fff;padding:12px;font-family:monospace;font-size:1rem}
  .go{background:var(--accent);color:#04120f;border:none;border-radius:10px;padding:0 18px;font-weight:bold;cursor:pointer}
  .feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.95rem;display:none}
  .feedback.show{display:block}
  .feedback.good{background:rgba(90,214,125,.12);border:1px solid var(--ok);color:#c8f6d6}
  .feedback.bad{background:rgba(255,90,106,.1);border:1px solid var(--danger);color:#ffd0d5}
  .sci{color:var(--accent);font-family:monospace;font-size:.85rem}
  .hint{color:var(--dim);font-size:.85rem;margin-top:8px;cursor:pointer;text-decoration:underline dotted}
  .foot{margin-top:22px;text-align:center;color:var(--dim);font-size:.78rem;font-family:monospace}
  a{color:var(--accent)}
  .end{font-size:1.3rem;text-align:center;padding:10px}
  .board{margin-top:16px}
  .board h3{font-family:monospace;color:var(--accent2);letter-spacing:1px;font-size:.72rem;
     text-transform:uppercase;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .board .clear{cursor:pointer;color:var(--dim);text-decoration:underline dotted;font-size:.85em}
  table.score{width:100%;border-collapse:collapse;font-family:monospace;font-size:.82rem}
  table.score th,table.score td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
  table.score th{color:var(--dim);font-weight:normal}
  table.score tr.you td{color:var(--accent);font-weight:bold}
  table.score td.rank{color:var(--accent2)}
  .board .empty{color:var(--dim);font-family:monospace;font-size:.82rem;padding:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">A hard-science interactive thriller</div>
  <h1>THE&nbsp;HELIX&nbsp;PROTOCOL</h1>
  <div class="hud">
    <span class="chip">◇ Trial <b id="hud-scene">0/8</b></span>
    <span class="chip">✦ Insight <b id="hud-score">0</b></span>
    <span class="chip time" id="timeChip">⏱ <b id="clock">08:00</b></span>
    <span class="chip">Integrity</span>
    <span class="bar"><i id="hp" style="width:100%"></i></span>
  </div>

  <div class="panel" id="panel">
    <div class="scene-title" id="title">Dossier</div>
    <div class="story" id="story"></div>
    <div class="prompt" id="prompt" style="display:none"></div>
    <div class="opts" id="opts"></div>
    <div class="row" id="inputRow" style="display:none">
      <input type="text" id="answer" placeholder="Type your answer…" autocomplete="off">
      <button class="go" id="submit">Solve</button>
    </div>
    <div class="hint" id="hint" style="display:none"></div>
    <div class="feedback" id="fb"></div>
  </div>

  <div class="board" id="board"></div>

  <div class="foot">Runs entirely in your browser — no server, no tokens. Fresh puzzles every run. <a href="index.html">← back to site</a></div>
</div>

<script>
/* ============================================================
   THE HELIX PROTOCOL  —  replayable edition
   You: startup founder-philanthropist, MD/neurosurgeon,
   computational cell & molecular biologist and bioengineer.
   * Countdown mission timer (drains; wrong answers cost time).
   * Each trial slot draws a RANDOM variant from a pool, so
     every playthrough serves fresh science puzzles.
   Pure client-side. No API calls. Zero runtime tokens.
   ============================================================ */

/* ---------- answer helpers ---------- */
const num  = s => parseFloat(String(s).replace(/[^0-9.\-eE]/g,''));
const near = (v,t,tol) => Math.abs(v-t) <= tol;
const has  = (s,...k) => { s=String(s).toLowerCase(); return k.some(x=>s.includes(x)); };
const pick = a => a[Math.floor(Math.random()*a.length)];
const numCheck = (target,tol,why) => a => ({ok:near(num(a),target,tol), why});

/* ---------- fixed framing scene ---------- */
const intro = {
 title:"Dossier — 02:14, Geneva",
 story:`Your secure line lights up. A biotech consortium, HELIX, has weaponized a synthetic prion and hidden a killswitch across a chain of locked "trials." A colleague is already dead. The mission clock is running.

They know your record: neurosurgeon, molecular biologist, bioengineer, founder of a philanthropic gene-therapy lab. So they built the traps around exactly what you know.

A voice: "Doctor. Every wrong step burns time and Integrity. Let either hit zero and the release is automatic. Reason well."`,
 prompt:"Do you accept?",
 choices:[
   {t:"Accept. Open Trial I.", correct:true, why:"The clock is live. Every trap is a science problem in disguise."},
   {t:"Trace the call first.", correct:false, why:"Onion-routed — it bounces the globe. Time bleeds, you learn nothing. Reason forward instead."}
 ]
};

/* ---------- puzzle POOLS: one slot per trial, many variants each ---------- */
/* On each run, one variant is drawn from every pool. */
const pools = [

/* Trial I — CHEMISTRY */
[
 { title:"Trial I — The Poisoned Vial (Chemistry)",
   story:`A cryovial sits in a sealed chamber. Condensate in chamber A reads pH 3.0; identical chamber B reads pH 6.0. The neutralizing enzyme releases only if you state how much MORE acidic A is than B.`,
   prompt:"How many times greater is [H⁺] at pH 3.0 vs pH 6.0? (a number)",
   check:numCheck(1000,0.5,"pH = −log₁₀[H⁺]; each unit = 10×. Δ3 → 10³ = 1000×. Enzyme stabilizes."),
   hint:"Each pH unit is a factor of ten; the gap is 3 units." },
 { title:"Trial I — The Buffer Lock (Chemistry)",
   story:`A door buffer holds equal concentrations of a weak acid and its conjugate base (pKa 4.8). A keypad wants the resulting pH.`,
   prompt:"By Henderson–Hasselbalch, what is the pH when [A⁻] = [HA]? (a number)",
   check:numCheck(4.8,0.15,"pH = pKa + log([A⁻]/[HA]) = pKa + log(1) = pKa = 4.8."),
   hint:"log(1) = 0, so pH collapses to pKa." },
 { title:"Trial I — The Titration Seal (Chemistry)",
   story:`25.0 mL of HCl is neutralized exactly by 50.0 mL of 0.10 M NaOH. The lock needs the acid's molarity.`,
   prompt:"What is the concentration of the HCl in mol/L? (a number)",
   check:numCheck(0.2,0.01,"Moles base = 0.050 L × 0.10 = 0.005 mol = moles acid. ÷0.025 L = 0.2 M."),
   hint:"Moles = V×C; at equivalence moles acid = moles base; divide by acid volume." }
],

/* Trial II — MEDICINE */
[
 { title:"Trial II — The Failing Heart (Medicine)",
   story:`A hostage is wired to a monitor rigged to the lock. ECG: wide sine-wave QRS, no P waves. Labs: K⁺ 7.9 mmol/L. Four unlabeled syringes hang before you.`,
   prompt:"Severe hyperkalemia with a sine-wave ECG — what protects the myocardium FIRST?",
   choices:[
     {t:"IV calcium gluconate", correct:true, why:"Calcium stabilizes the cardiac membrane in minutes — buys life while shift agents work. Correct first move."},
     {t:"Insulin + glucose", correct:false, why:"Shifts K⁺ intracellularly but slower to protect myocardium. Membrane stabilization comes first."},
     {t:"Oral potassium binder", correct:false, why:"Far too slow for a sine-wave pattern. Stabilize the membrane now."},
     {t:"Immediate defibrillation", correct:false, why:"There's a perfusing rhythm — shocking it is wrong. Give calcium."}
   ]},
 { title:"Trial II — The Overdose (Medicine)",
   story:`A guard collapses: pinpoint pupils, respiratory rate 4, unresponsive. An open vial of an opioid rolls on the floor. Four antidotes are within reach.`,
   prompt:"Pinpoint pupils + respiratory depression from opioids — what do you give?",
   choices:[
     {t:"Naloxone", correct:true, why:"A competitive opioid-receptor antagonist — reverses respiratory depression fast. Correct."},
     {t:"Flumazenil", correct:false, why:"That reverses benzodiazepines, not opioids. Wrong toxidrome."},
     {t:"Atropine", correct:false, why:"For bradycardia/cholinergic excess — pupils here are pinpoint from opioids, not organophosphates."},
     {t:"N-acetylcysteine", correct:false, why:"That's the acetaminophen antidote. Wrong poison."}
   ]},
 { title:"Trial II — The Anion Gap (Medicine)",
   story:`A screen shows a captive's chemistry: Na⁺ 140, Cl⁻ 100, HCO₃⁻ 12 mmol/L. The lock demands the anion gap to confirm a metabolic acidosis.`,
   prompt:"Compute the anion gap = Na⁺ − (Cl⁻ + HCO₃⁻). (a number)",
   check:numCheck(28,0.5,"140 − (100 + 12) = 28 — a high anion gap metabolic acidosis. Lock opens."),
   hint:"Na⁺ minus the sum of chloride and bicarbonate." }
],

/* Trial III — PHYSICS */
[
 { title:"Trial III — The Locked Isotope (Physics)",
   story:`A door is sealed by a decaying tracer: 80 GBq now, opening at 10 GBq. Plaque: "Half-life = 6 hours." A timer wants the wait.`,
   prompt:"Hours for 80 GBq to decay to 10 GBq? (a number)",
   check:numCheck(18,0.6,"80→40→20→10 = three halvings × 6 h = 18 h."),
   hint:"Count halvings from 80 to 10, times the half-life." },
 { title:"Trial III — The Lens Trap (Physics)",
   story:`A laser must focus through a converging lens of focal length 10 cm onto a detector. The source sits 15 cm from the lens.`,
   prompt:"By 1/f = 1/do + 1/di, what image distance di (cm) hits the detector? (a number)",
   check:numCheck(30,0.6,"1/10 = 1/15 + 1/di → 1/di = 1/10−1/15 = 1/30 → di = 30 cm."),
   hint:"1/di = 1/f − 1/do = 1/10 − 1/15." },
 { title:"Trial III — The Charged Gate (Physics)",
   story:`A capacitive gate stores energy. It holds 2 microfarads charged to 1000 volts; discharge fires the release only if you state the stored energy.`,
   prompt:"Energy E = ½CV² in joules? (a number)",
   check:numCheck(1,0.05,"E = ½·(2e-6)·(1000)² = ½·2e-6·1e6 = 1 J."),
   hint:"½ · 2×10⁻⁶ · (10³)²." }
],

/* Trial IV — MOLECULAR BIOLOGY */
[
 { title:"Trial IV — The Genetic Cipher (Molecular Biology)",
   story:`A screen shows the template strand triplet of the kill-switch promoter, read 3'→5':  3'-TAC-5'. Give what it encodes and the switch arms.`,
   prompt:"Template 3'-TAC-5' → which mRNA codon, and which amino acid?",
   check:a=>({ok:has(a,"aug","methionine","met","start"),
     why:"Template 3'-TAC-5' → mRNA 5'-AUG-3' = Methionine, the START codon. Armed."}),
   hint:"Antiparallel complement: T→A, A→U, C→G. Which codon starts translation?" },
 { title:"Trial IV — The Reading Frame (Molecular Biology)",
   story:`HELIX shows an mRNA segment: 5'-AUG GCU UAA-3'. The lock asks how many amino acids the ribosome adds before it stops.`,
   prompt:"How many amino acids are translated from 5'-AUG GCU UAA-3'? (a number)",
   check:numCheck(2,0.1,"AUG(Met)–GCU(Ala)–UAA(STOP). Two amino acids, then release."),
   hint:"UAA is a stop codon and adds nothing; count the coding triplets before it." },
 { title:"Trial IV — The Melting Point (Molecular Biology)",
   story:`A primer must bind only the pathogen sequence. Two candidate duplexes are offered: one AT-rich, one GC-rich. The lock opens for the more thermally STABLE choice.`,
   prompt:"Which duplex has the higher melting temperature — 'AT-rich' or 'GC-rich'?",
   check:a=>({ok:has(a,"gc","g-c","g/c","guanine"),
     why:"G–C pairs share three hydrogen bonds vs two for A–T, so GC-rich duplexes melt at higher temperature."}),
   hint:"Which base pair has three hydrogen bonds?" }
],

/* Trial V — CHEMISTRY / MATH (dilution & stoichiometry) */
[
 { title:"Trial V — The Dilution Trap (Chemistry/Math)",
   story:`Prepare exactly 500 mL of 0.2 M neutralizer from 5 M stock. Overshoot and the reaction runs away.`,
   prompt:"How many mL of 5 M stock do you draw? (a number)",
   check:numCheck(20,0.4,"C₁V₁=C₂V₂ → 5·V₁ = 0.2·500 = 100 → V₁ = 20 mL, topped to 500."),
   hint:"C₁V₁ = C₂V₂; solve for V₁." },
 { title:"Trial V — The Molar Mass (Chemistry/Math)",
   story:`You must weigh out 0.5 mol of glucose (C₆H₁₂O₆, molar mass 180 g/mol) to quench the batch.`,
   prompt:"How many grams of glucose is 0.5 mol? (a number)",
   check:numCheck(90,1,"mass = moles × molar mass = 0.5 × 180 = 90 g."),
   hint:"grams = moles × molar mass." },
 { title:"Trial V — The Serial Dilution (Chemistry/Math)",
   story:`A 1:10 serial dilution is repeated three times from a 300 mg/mL stock to reach the safe working concentration.`,
   prompt:"After three tenfold dilutions, what is the concentration in mg/mL? (a number)",
   check:numCheck(0.3,0.02,"300 / 10³ = 300/1000 = 0.3 mg/mL."),
   hint:"Divide by 10 three times → divide by 1000." }
],

/* Trial VI — PHARMACOLOGY */
[
 { title:"Trial VI — The Dose Calculus (Pharmacology)",
   story:`Antidote infusion ordered at 4 mcg/kg/min for an 80 kg patient. Bag concentration 3200 mcg/mL. Pump takes mL/hour.`,
   prompt:"What rate in mL/hour do you set? (a number)",
   check:numCheck(6,0.3,"4×80 = 320 mcg/min = 19 200 mcg/hr ÷ 3200 = 6 mL/hr."),
   hint:"Dose×weight → per min → per hour → ÷ concentration." },
 { title:"Trial VI — The Drip Rate (Pharmacology)",
   story:`1000 mL of antidote must run over 4 hours through a gravity set delivering 60 drops/mL.`,
   prompt:"What drip rate in drops per MINUTE? (a number)",
   check:numCheck(250,4,"1000 mL/4 h = 250 mL/h = 4.17 mL/min × 60 gtt = 250 gtt/min."),
   hint:"mL per minute × drop factor (60)." },
 { title:"Trial VI — The Half-Life Clearance (Pharmacology)",
   story:`A toxin plasma level is 160 mcg/L; the safe threshold is 10 mcg/L. The drug's half-life is 2 hours.`,
   prompt:"Hours of clearance to fall from 160 to 10 mcg/L? (a number)",
   check:numCheck(8,0.3,"160→80→40→20→10 = four half-lives × 2 h = 8 h."),
   hint:"Count halvings from 160 to 10, × half-life." }
],

/* Trial VII — COMP BIO / MATH (growth) */
[
 { title:"Trial VII — The Spreading Contagion (Comp Bio/Math)",
   story:`A vector divides every 20 minutes. Containment fails at 4096× the seed. Their console demands the exact breach time — a bluff to make you flee early.`,
   prompt:"With 20-min doubling, hours to reach 4096×? (a number)",
   check:numCheck(4,0.25,"4096 = 2¹² → 12 doublings × 20 min = 240 min = 4 h."),
   hint:"4096 is a power of two; how many doublings × 20 min?" },
 { title:"Trial VII — The PCR Amplifier (Comp Bio/Math)",
   story:`A sabotaged thermocycler doubles target DNA each cycle. The alarm trips when one copy becomes over one million copies.`,
   prompt:"How many cycles to exceed 1,000,000 copies from 1? (a number)",
   check:numCheck(20,0.5,"2²⁰ = 1,048,576 > 10⁶, while 2¹⁹ ≈ 524k. So 20 cycles."),
   hint:"2^10 ≈ 1000, so 2^20 ≈ a million." },
 { title:"Trial VII — The Decay Model (Comp Bio/Math)",
   story:`An antitoxin degrades exponentially, losing half its potency every cycle. It starts at 100% and must stay above 10% to work.`,
   prompt:"What is the LAST whole cycle at which potency is still above 10%? (a number)",
   check:numCheck(3,0.1,"100→50→25→12.5→6.25. Cycle 3 = 12.5% (still >10%); cycle 4 drops below. Answer 3."),
   hint:"Halve from 100 and find the last value above 10." }
],

/* Trial VIII — NEUROSCIENCE / SYNTHESIS (fixed finale, still varied) */
[
 { title:"Trial VIII — The Final Switch (Neuroscience)",
   story:`The master killswitch is a light-gated channel you engineered years ago, before HELIX stole it. To fire the cascade you must ACTIVATE — depolarize — the engineered cells with ~470 nm blue light. Three emitters hang overhead.`,
   prompt:"Which optogenetic tool DEPOLARIZES (activates) cells under ~470 nm blue light?",
   choices:[
     {t:"Channelrhodopsin-2 (ChR2)", correct:true, why:"ChR2 is a blue-light cation channel — it depolarizes/activates. The cascade fires. Release aborted."},
     {t:"Halorhodopsin (NpHR)", correct:false, why:"A yellow-light chloride pump — hyperpolarizes/silences. Wrong direction."},
     {t:"Archaerhodopsin (Arch)", correct:false, why:"A green-light proton pump that silences cells. You need activation."}
   ]},
 { title:"Trial VIII — The Resting Membrane (Neuroscience)",
   story:`The final override reads out the neuron's resting potential and asks which ion's equilibrium it sits nearest — the key to which channel dominates at rest.`,
   prompt:"At rest (~ −70 mV), the membrane potential lies nearest which ion's equilibrium — 'potassium' or 'sodium'?",
   check:a=>({ok:has(a,"potassium","k+","k "),
     why:"At rest the membrane is most permeable to K⁺, so Vm sits near E_K (~−90 mV), far from E_Na (~+60 mV). Override released."}),
   hint:"Which ion is the membrane most permeable to at rest?" },
 { title:"Trial VIII — The Action Potential (Neuroscience)",
   story:`To trigger the cascade one clean action potential must fire. The console asks which ion rushes IN to drive the rapid depolarizing upstroke.`,
   prompt:"Which ion influx causes the depolarizing upstroke of an action potential?",
   check:a=>({ok:has(a,"sodium","na+","na "),
     why:"Voltage-gated Na⁺ channels open and Na⁺ rushes in, driving the upstroke. The cascade fires — release aborted."}),
   hint:"Voltage-gated channels for which ion open first at threshold?" }
]
];

/* ---------- game state & flow ---------- */
const MISSION_SECONDS = 8*60; // 8:00 on the clock
const state = { i:0, score:0, hp:100, hintsUsed:0, seconds:MISSION_SECONDS, scenes:[], timer:null };
const $ = id => document.getElementById(id);

function buildRun(){
  state.scenes = [intro, ...pools.map(pick)];
}

/* ---------- best-run scoreboard (localStorage) ---------- */
const BOARD_KEY = "helix_scores_v1";
let lastRunId = null;
function loadBoard(){
  try{ return JSON.parse(localStorage.getItem(BOARD_KEY)) || []; }catch(e){ return []; }
}
function rankRuns(runs){
  // higher score first; tie-break by time left, then integrity, then fewer hints
  return runs.slice().sort((a,b)=>
    b.score-a.score || b.seconds-a.seconds || b.hp-a.hp || a.hints-b.hints);
}
function saveRun(run){
  run.id = Date.now()+"-"+Math.random().toString(36).slice(2,6);
  lastRunId = run.id;
  const runs = rankRuns([...loadBoard(), run]).slice(0,5); // keep top 5
  try{ localStorage.setItem(BOARD_KEY, JSON.stringify(runs)); }catch(e){}
}
function clearBoard(){
  try{ localStorage.removeItem(BOARD_KEY); }catch(e){}
  lastRunId=null; renderBoard();
}
function mmss(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function renderBoard(){
  const el=$("board"); const runs=rankRuns(loadBoard());
  let rows;
  if(!runs.length){
    rows=`<div class="empty">No missions logged yet — disarm the Protocol to set a record.</div>`;
  } else {
    rows=`<table class="score"><tr><th>#</th><th>Insight</th><th>Time left</th><th>Integrity</th><th>Hints</th><th>Date</th></tr>`
      + runs.map((r,i)=>`<tr class="${r.id===lastRunId?'you':''}">`
        + `<td class="rank">${i+1}</td><td>${r.score}</td><td>${mmss(r.seconds)}</td>`
        + `<td>${Math.round(r.hp)}%</td><td>${r.hints}</td><td>${r.date}</td></tr>`).join("")
      + `</table>`;
  }
  el.innerHTML=`<h3><span>★ Best Runs</span>`
    + (runs.length?`<span class="clear" onclick="clearBoard()">clear</span>`:``)
    + `</h3>`+rows;
}

function startTimer(){
  clearInterval(state.timer);
  state.timer = setInterval(()=>{
    state.seconds--;
    paintClock();
    if(state.seconds<=0){ clearInterval(state.timer); timeUp(); }
  },1000);
}
function paintClock(){
  const m=Math.floor(Math.max(0,state.seconds)/60), s=Math.max(0,state.seconds)%60;
  $("clock").textContent = m+":"+String(s).padStart(2,"0");
  $("timeChip").classList.toggle("warn", state.seconds<=60);
}

function render(){
  const s = state.scenes[state.i];
  $("hud-scene").textContent = state.i + "/" + pools.length;
  $("hud-score").textContent = state.score;
  $("hp").style.width = Math.max(0,state.hp) + "%";
  $("title").textContent = s.title;
  $("story").textContent = s.story;
  $("prompt").style.display = "block";
  $("prompt").textContent = s.prompt;
  $("fb").className = "feedback";
  const opts=$("opts"); opts.innerHTML="";
  const row=$("inputRow"); const hint=$("hint");
  hint.dataset.done="";
  hint.style.display = s.hint ? "block":"none";
  if(s.hint){ hint.textContent="Need a nudge? (costs Integrity + time)";
    hint.onclick=()=>{ if(hint.dataset.done)return; hint.dataset.done=1;
      hint.textContent="Hint: "+s.hint;
      state.hp=Math.max(0,state.hp-4); state.seconds=Math.max(1,state.seconds-15); state.hintsUsed++;
      $("hp").style.width=state.hp+"%"; paintClock(); }; }
  if(s.choices){
    row.style.display="none";
    s.choices.forEach(c=>{ const b=document.createElement("button"); b.className="opt";
      b.textContent=c.t; b.onclick=()=>resolve(c.correct,c.why); opts.appendChild(b); });
  } else {
    row.style.display="flex"; $("answer").value=""; $("answer").focus();
    $("submit").disabled=false; $("submit").onclick=submit;
    $("answer").onkeydown=e=>{ if(e.key==="Enter") submit(); };
  }
}
function submit(){ const s=state.scenes[state.i]; const r=s.check($("answer").value); resolve(r.ok,r.why); }

function resolve(ok, why){
  const fb=$("fb");
  if(ok){ state.score+=10; fb.className="feedback show good"; fb.innerHTML="✔ "+why; }
  else  { state.hp=Math.max(0,state.hp-18); state.seconds=Math.max(1,state.seconds-30);
          fb.className="feedback show bad"; fb.innerHTML="✘ "+why; paintClock(); }
  $("hp").style.width=state.hp+"%"; $("hud-score").textContent=state.score;
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("submit").disabled=true;
  setTimeout(()=>{
    if(state.hp<=0) return end(false,"integrity");
    if(ok) state.i++;
    if(state.i>=state.scenes.length) return end(true);
    render();
  }, ok?1500:2600);
}
function timeUp(){ if(state.hp>0) end(false,"time"); }

function end(won, cause){
  clearInterval(state.timer);
  const p=$("panel");
  if(won){
    saveRun({ score:state.score, hp:state.hp, seconds:state.seconds,
              hints:state.hintsUsed, date:new Date().toLocaleDateString() });
    renderBoard();
    const isBest = rankRuns(loadBoard())[0].id === lastRunId;
    const grade = state.hintsUsed===0 && state.hp>82 && state.seconds>180
      ? "FLAWLESS — a true polymath run." :
      state.hp>50 ? "The world is safe. Steady hands, sharp mind."
      : "You made it — bruised, but the release is aborted.";
    p.innerHTML=`<div class="scene-title">Case closed — Geneva</div>
      <div class="end">✦ THE HELIX PROTOCOL — DISARMED ✦${isBest?`<br><span style="color:var(--accent2);font-size:.9rem;font-family:monospace">★ NEW BEST RUN ★</span>`:``}</div>
      <div class="story">The killswitch cascade sweeps the vector inert; the prion batch denatures. Somewhere, thousands wake to an ordinary morning and never know your name.

Insight: <b>${state.score}</b> · Integrity: <b>${Math.round(state.hp)}%</b> · Time left: <b>${Math.floor(state.seconds/60)}:${String(state.seconds%60).padStart(2,"0")}</b> · Hints: <b>${state.hintsUsed}</b>
${grade}</div>
      <div class="opts">
        <button class="opt" onclick="restart()">↻ New mission (fresh puzzles)</button>
        <button class="opt" onclick="location.href='index.html'">← Return to site</button></div>`;
  } else {
    const msg = cause==="time"
      ? "⏱ The mission clock hit zero. The release triggered."
      : "☠ Integrity depleted. The release triggered.";
    p.innerHTML=`<div class="scene-title">Mission failed</div>
      <div class="end">${msg}<br><br>Every good scientist reruns the experiment.</div>
      <div class="opts"><button class="opt" onclick="restart()">↻ Reset the timeline (fresh puzzles)</button></div>`;
  }
}

function restart(){
  state.i=0; state.score=0; state.hp=100; state.hintsUsed=0; state.seconds=MISSION_SECONDS;
  $("panel").innerHTML=PANEL_HTML;
  buildRun(); paintClock(); startTimer(); render();
}

const PANEL_HTML = $("panel").innerHTML;
buildRun(); paintClock(); startTimer(); render(); renderBoard();
</script>
</body>
</html>
